name: Verify Sada web app
on:
  push:
    branches: [test-the]
  pull_request:
    branches: [test-the]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build app
        run: bun run build
      - name: Run tests
        run: bun run test
