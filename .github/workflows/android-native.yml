name: Build Sada Android APK
on:
  push:
    branches: [test-the]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        working-directory: android-native
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare named APK and checksum
        run: |
          cp android-native/app/build/outputs/apk/debug/app-debug.apk Sada.apk
          sha256sum Sada.apk > Sada.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sada-android-apk
          path: |
            Sada.apk
            Sada.apk.sha256
          if-no-files-found: error
          retention-days: 30
