<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>صدى — غرف الدردشة الصوتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&family=Sora:wght@400;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app/styles.css" />
<script src="sada-assets.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<script>
  try {
    const sadaSession = JSON.parse(localStorage.getItem("sada.supabase.session") || "null");
    if (!sadaSession || !sadaSession.access_token) window.location.replace("/");
  } catch (_) { window.location.replace("/"); }
</script>
<div id="root"></div>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/party.jsx"></script>
<script type="text/babel" src="app/social.jsx"></script>
<script type="text/babel" src="app/me.jsx"></script>
<script type="text/babel" src="app/room.jsx"></script>
<script type="text/babel">
const LS = 'frost-app-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
const nowT = () => new Date().toTimeString().slice(0, 5);

function App() {
  const saved = useMemo(load, []);
  const [tab, setTab] = useState(saved.tab || 'party');
  const [partyTab, setPartyTab] = useState(saved.partyTab || 'parties');
  const [msgTab, setMsgTab] = useState(saved.msgTab || 'msgs');
  const [stack, setStack] = useState([]);
  const [room, setRoom] = useState(null);
  const [roomMin, setRoomMin] = useState(false);
  const [me, setMe] = useState(saved.me || ME0);
  const [coins, setCoins] = useState(saved.coins ?? 0);
  const [diamonds, setDiamonds] = useState(saved.diamonds ?? 0);
  const [following, setFollowing] = useState(saved.following || [1000210]);
  const [followedRooms, setFollowedRooms] = useState(saved.followedRooms || []);
  const [recentRooms, setRecentRooms] = useState(saved.recentRooms || []);
  const [owned, setOwned] = useState(saved.owned || []);
  const [claimed, setClaimed] = useState(saved.claimed || []);
  const [log, setLog] = useState(saved.log || []);
  const [notif, setNotif] = useState(saved.notif || { notice: 2, official: 3, reward: 5 });
  const [threads, setThreads] = useState(saved.threads || { 1000210: [] });
  const [toastMsg, setToastMsg] = useState(null);
  const [scale, setScale] = useState(1);
  const [, setAssetVersion] = useState(0);

  useEffect(() => {
    const onAssetsReady = () => setAssetVersion(v => v + 1);
    window.addEventListener('sada-assets-ready', onAssetsReady);
    return () => window.removeEventListener('sada-assets-ready', onAssetsReady);
  }, []);

  useEffect(() => {
    localStorage.setItem(LS, JSON.stringify({ tab, partyTab, msgTab, me, coins, diamonds, following, followedRooms, recentRooms, owned, claimed, log, notif, threads }));
  }, [tab, partyTab, msgTab, me, coins, diamonds, following, followedRooms, recentRooms, owned, claimed, log, notif, threads]);
  useEffect(() => {
    const f = () => setScale(Math.min(1, (window.innerHeight - 24) / 864, (window.innerWidth - 24) / 410));
    f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f);
  }, []);

  const toast = (t) => { setToastMsg({ t, k: Date.now() }); };
  useEffect(() => { if (!toastMsg) return; const x = setTimeout(() => setToastMsg(null), 2000); return () => clearTimeout(x); }, [toastMsg]);
  const pushLog = (t, v) => setLog(l => [...l.slice(-80), { t, v, time: new Date().toLocaleString('en-GB').slice(0, 17) }]);
  const addCoins = (n) => { setCoins(c => c + n); pushLog('شحن العملات', n); };
  const claim = (key, n) => { if (claimed.includes(key)) return; setClaimed(c => [...c, key]); setCoins(c => c + n); pushLog('مكافأة', n); toast(`+${n} عملة`); };
  const toggleFollow = (id) => { setFollowing(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]); setMe(m => ({ ...m, following: following.includes(id) ? m.following - 1 : m.following + 1 })); };
  const toggleFollowRoom = (id) => setFollowedRooms(f => f.includes(id) ? f.filter(x => x !== id) : [id, ...f]);
  const sendDM = (uid, m) => {
    setThreads(t => ({ ...t, [uid]: [...(t[uid] || []), { from: 'me', t: nowT(), ...m }] }));
    if (m.gift) { const g = GIFTS.find(x => x.n === m.gift); if (coins < g.p) { toast('رصيد غير كافٍ'); return; } setCoins(c => c - g.p); pushLog('هدية ' + g.n, -g.p); }
    setTimeout(() => setThreads(t => ({ ...t, [uid]: [...(t[uid] || []), { from: uid, t: nowT(), text: m.gift ? 'شكراً على الهدية ❤' : CHAT_LINES[Math.floor(Math.random() * CHAT_LINES.length)] }] })), 1400);
  };
  const friends = following;

  const go = (p) => setStack(s => [...s, p]);
  const back = () => setStack(s => s.slice(0, -1));
  const openRoom = (r) => {
    setRoom(r); setRoomMin(false); setStack([]);
    setRecentRooms(rs => [r.id, ...rs.filter(x => x !== r.id)].slice(0, 8));
  };
  const openCat = (c) => { setNotif(n => ({ ...n, [c]: 0 })); go({ p: 'notif', cat: c }); };
  const unread = notif.notice + notif.official + notif.reward;

  const ctx = { me, setMe, coins, setCoins, diamonds, setDiamonds, addCoins, following, toggleFollow, followedRooms, toggleFollowRoom, recentRooms: recentRooms.length ? recentRooms : [], owned, setOwned, claimed, claim, log, pushLog, notif, threads, sendDM, friends, toast };
  const top = stack[stack.length - 1];
  const userGo = (id) => go({ p: 'user', id });

  const renderPage = (pg) => {
    switch (pg.p) {
      case 'user': return <ProfilePage uid={pg.id} onBack={back} onChat={(id) => go({ p: 'chat', id })} onRoom={openRoom} />;
      case 'chat': return <ChatPage uid={pg.id} onBack={back} onUser={userGo} />;
      case 'notif': return <NotifPage cat={pg.cat} onBack={back} />;
      case 'event': return <EventDetail b={pg.b} onBack={back} />;
      case 'rank': return <RankingPage kind={pg.k} onBack={back} onUser={userGo} />;
      case 'wallet': return <WalletPage onBack={back} />;
      case 'vip': return <VipPage onBack={back} />;
      case 'store': return <StorePage onBack={back} initial={pg.tab || 'frame'} />;
      case 'level': return <LevelPage onBack={back} />;
      case 'badges': return <BadgesPage onBack={back} />;
      case 'tasks': return <TasksPage onBack={back} />;
      case 'host': return <HostPage onBack={back} />;
      case 'records': return <RecordsPage onBack={back} />;
      case 'feedback': return <FeedbackPage onBack={back} />;
      case 'settings': return <SettingsPage onBack={back} go={go} />;
      case 'edit': return <EditPage onBack={back} />;
      case 'follow': return <FollowPage k={pg.k} onBack={back} onUser={userGo} />;
      default: return null;
    }
  };

  const tabsLeft = (
    <>
      <GlossBtn icon="castle" tone="ice" size={34} onClick={() => openRoom({ ...MY_ROOM, name: me.name })} />
      <GlossBtn icon="search" tone="gold" size={34} onClick={() => { setTab('msg'); setMsgTab('friends'); }} />
    </>
  );

  return (
    <AppCtx.Provider value={ctx}>
      <div className="stage">
        <div className="device" style={{ transform: `scale(${scale})` }}>
          <div className="screen">
            <div className="island" />
            {/* main tabs */}
            <div className="tabscreen" key={tab}>
              {tab === 'party' && <>
                <SkyBackdrop h={250} />
                <div className="tabscreen-in">
                  <StatusBar />
                  <TopTabs active={partyTab} onChange={setPartyTab} left={tabsLeft} tabs={[{ id: 'mine', label: 'ملكي' }, { id: 'parties', label: 'حفلات' }, { id: 'events', label: 'فعالية' }]} />
                  {partyTab === 'parties' && <PartiesView onOpenRoom={openRoom} onOpenRank={(k) => go({ p: 'rank', k })} />}
                  {partyTab === 'mine' && <MineView onOpenRoom={openRoom} />}
                  {partyTab === 'events' && <EventsView onOpen={(b) => go({ p: 'event', b })} />}
                </div>
              </>}
              {tab === 'msg' && <>
                <SkyBackdrop h={170} />
                <div className="tabscreen-in">
                  <StatusBar />
                  <TopTabs active={msgTab} onChange={setMsgTab} tabs={[{ id: 'msgs', label: 'الرسائل' }, { id: 'friends', label: 'الأصدقاء' }]} />
                  {msgTab === 'msgs' ? <MessagesView onOpenCat={openCat} onOpenChat={(id) => go({ p: 'chat', id })} /> : <FriendsView onUser={userGo} onChat={(id) => go({ p: 'chat', id })} />}
                </div>
              </>}
              {tab === 'me' && <>
                <SkyBackdrop h={300} />
                <div className="tabscreen-in">
                  <StatusBar />
                  <MeView go={go} />
                </div>
              </>}
            </div>
            <BottomNav tab={tab} onTab={(t) => { setTab(t); setStack([]); }} unread={unread} />
            {room && roomMin && <MiniRoom room={room} onOpen={() => setRoomMin(false)} onClose={() => setRoom(null)} />}
            {/* pushed pages */}
            {stack.map((pg, i) => <div key={i + pg.p} style={{ position: 'absolute', inset: 0, zIndex: 60 + i, display: i === stack.length - 1 ? 'block' : 'none' }}>{renderPage(pg)}</div>)}
            {room && !roomMin && <RoomPage key={room.id} room={room} onClose={() => setRoom(null)} onMinimize={() => setRoomMin(true)} onUser={(id) => { setRoomMin(true); userGo(id); }} />}
            {toastMsg && <div key={toastMsg.k} className="toast">{toastMsg.t}</div>}
            <div className="splash"><div style={{ textAlign: 'center' }}><div className="splash-logo"><Ic n="snow" s={58} c="#fff" w={1.6} /></div><div style={{ fontFamily: 'var(--display)', fontWeight: 700, fontSize: 30, color: '#fff', marginTop: 14, textShadow: '0 2px 8px rgba(0,40,120,.4)' }}>صدى</div><div style={{ color: '#E3F0FF', fontSize: 13 }}>غرف دردشة صوتية</div></div></div>
          </div>
        </div>
      </div>
    </AppCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
